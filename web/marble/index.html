    const suf = entranceActive() ? (left <= 1 ? '·末' : '·' + left) : '';
    if(fx.L){
      const lm = Math.pow(2, fx.L) * (fx.R > 0 ? -Math.pow(2, fx.R - 1) : 1);
      c.push({ t: '左' + (lm > 0 ? '+' : '') + lm + suf, col: left <= 1 ? '#ff6b5e' : '#ffd166' });
    }
    if(fx.R){
      const rm = Math.pow(2, fx.R) * (fx.L > 0 ? -Math.pow(2, fx.L - 1) : 1);
      c.push({ t: '右' + (rm > 0 ? '+' : '') + rm + suf, col: left <= 1 ? '#ff6b5e' : '#ffd166' });
    }
    if(fx.perm) c.push({ t: '错位' + suf, col: left <= 1 ? '#ff6b5e' : '#c2a3ff' });
    const sn = fx.sealed.filter(Boolean).length;
    if(sn) c.push({ t: '封' + sn + suf, col: left <= 1 ? '#ff6b5e' : '#cfd6e0' });
    if(flyers.length > 1) c.push({ t: flyers.length + '球', col: '#7dffa0' });
    for(const b of flyers){ if(b.fire){ c.push({ t:'火', col:'#ffa04d' }); break; } }
    for(const b of flyers){ if(b.iceT > 0){ c.push({ t:'冰', col:'#7dd8ff' }); break; } }
    return c;
  }

  /* ---------- 首屏玩法提示（可关闭） ----------
   *  ★ 用户反馈过两个问题：
   *    ① 位置太靠下 —— 原来 cy = (fieldT+mouthY)*0.44 只是个凭感觉的系数，
   *       实际面板（高 306）会压到桶口以下。现在改成**按面板高度在场地里真正居中**。
   *    ② 没有关闭按钮、也不能触屏关闭 —— 以前只能靠「按发射键/方向键」顺带关掉，
   *       玩家想先看清规则就得先开一枪。现在：右上角 ✕ 按钮 + 轻点画面任意处 +
   *       Esc 键，三种方式都能关。 */
  const HINT_H = 322;                                  // 面板高（含底部「轻点关闭」那行）
  const HINT_PAD = 62;                                 // 面板顶到「标题基线」的距离
  /** 面板矩形（绘制与命中检测共用同一份计算，避免「画在一处、点判在另一处」） */
  function hintRect(){
    const hw = Math.min(132, (W - 14) / 2);            // 宽度自适应，窄屏不溢出
    // 在「场地可视区」（fieldT..mouthY）里垂直居中；再上移 6px 给底部桶口留点余量
    const cy = (fieldT + mouthY) / 2 - (HINT_H / 2 - HINT_PAD) - 6;
    return { cx: W / 2, cy, hw, top: cy - HINT_PAD, h: HINT_H,
             left: W / 2 - hw, w: hw * 2 };
  }
  /** ✕ 按钮的圆心与半径（放在面板右上角内侧） */
  function hintCloseBtn(){
    const r = hintRect();
    return { x: r.left + r.w - 16, y: r.top + 16, rad: 9.5 };
  }
  function closeHint(){
    if(!hintOn) return false;
    hintOn = false;
    return true;
  }

  function drawHint(){
    const r = hintRect();
    const { cx, cy, hw, top } = r;
    ctx.save();
    ctx.fillStyle = 'rgba(255,252,246,.93)';
    ctx.strokeStyle = '#e0b34c'; ctx.lineWidth = 2;
    roundRect(r.left, top, r.w, r.h, 14); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#c23b2c'; ctx.font = '800 24px ' + UI;
    ctx.fillText('弹珠乐园', cx, cy - 38);
    ctx.fillStyle = '#5a4231'; ctx.font = '700 12.5px ' + UI;
    ctx.fillText('◀ ▶ 调炮口角度（左键）', cx, cy - 16);
    ctx.fillStyle = '#5a4231'; ctx.font = '700 12.5px ' + UI;
    ctx.fillText('按住红色大键蓄力 · 松手发射', cx, cy + 2);
    ctx.fillStyle = '#8a6f52'; ctx.font = '11.5px ' + UI;
    ctx.fillText('撞钉/撞墙会反弹 → 落桶得分（桶面 ×' + SCORE_MULT + '）', cx, cy + 22);
    ctx.fillStyle = '#c23b2c'; ctx.font = '700 11.5px ' + UI;
    ctx.fillText('每发扣 1 条命；0 号桶不得分', cx, cy + 40);
    ctx.fillStyle = '#7a4b00'; ctx.font = '700 11.5px ' + UI;
    ctx.fillText('落进戴金冠的筒 → 额外 +1 命', cx, cy + 58);
    ctx.fillStyle = '#8a6f52'; ctx.font = '11px ' + UI;
    ctx.fillText('金冠默认在 8 号筒，每局 ' + Math.round(CROWN_MOVE_CHANCE * 100) + '% 会挪窝', cx, cy + 74);
    ctx.fillStyle = '#7a4b00'; ctx.font = '700 11.5px ' + UI;
    ctx.fillText('球撞彩色圆牌 = 吃道具；up 牌补命', cx, cy + 94);
    ctx.fillStyle = '#8a6f52'; ctx.font = '11px ' + UI;
    ctx.fillText('其余道具只管这一回合', cx, cy + 110);
    ctx.fillStyle = '#b4483f'; ctx.font = '700 11px ' + UI;
    ctx.fillText('道具/钉状态/入口变化 都留 ' + ITEM_LIFE + ' 回合（末回合闪）', cx, cy + 128);
    ctx.fillStyle = '#8a6f52'; ctx.font = '11px ' + UI;
    ctx.fillText('左和右互相抵消；入口被改过时外边缘会闪', cx, cy + 144);
    ctx.fillStyle = '#0d1015'; ctx.font = '700 11px ' + UI;
    ctx.fillText('黑炸弹（白骷髅）千万别碰 —— 会炸死球', cx, cy + 162);
    ctx.fillStyle = '#8a6f52'; ctx.font = '11px ' + UI;
    ctx.fillText('爆炸会炸掉范围内道具；炸到地雷会连环炸', cx, cy + 178);
    // ★ 撞针弹力图鉴：4 档颜色 = 4 档弹力（每局分布随机）
    ctx.fillStyle = '#7a4b00'; ctx.font = '700 11px ' + UI;
    ctx.fillText('撞针弹力（每局随机）', cx, cy + 200);
    const step = (hw * 2 - 24) / PEG_KINDS.length;
    let lx = cx - hw + 12 + step / 2;
    for(const K of PEG_KINDS){
      ctx.fillStyle = K.c[1];
      ctx.beginPath(); ctx.arc(lx, cy + 214, 5, 0, 7); ctx.fill();
      ctx.strokeStyle = K.ring; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(lx, cy + 214, 5, 0, 7); ctx.stroke();
      ctx.fillStyle = '#8a6f52'; ctx.font = '700 10.5px ' + UI;
      ctx.fillText(K.name, lx, cy + 228);
      lx += step;
    }
    /* ★ 底部「轻点关闭」提示 + 右上角 ✕ 按钮（用户要求能触屏关掉） */
    ctx.fillStyle = 'rgba(90,66,49,.62)'; ctx.font = '600 10.5px ' + UI;
    ctx.fillText('轻点画面任意处关闭', cx, cy + 248);
    const btn = hintCloseBtn();
    ctx.fillStyle = '#e8dcc8';
    ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.rad, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c9a24a'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.rad, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#7a5a2e'; ctx.lineWidth = 1.9; ctx.lineCap = 'round';
    const d = btn.rad * 0.42;
    ctx.beginPath();
    ctx.moveTo(btn.x - d, btn.y - d); ctx.lineTo(btn.x + d, btn.y + d);
    ctx.moveTo(btn.x + d, btn.y - d); ctx.lineTo(btn.x - d, btn.y + d);
    ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.restore();
    ctx.textAlign = 'left';
  }

  function draw(){
    // ★ 必须 S*dpr：变换作用在物理像素上，漏乘 dpr 画面只占 1/dpr（上一个游戏踩过）
    ctx.setTransform(S * dprNow, 0, 0, S * dprNow, OFFX * dprNow, OFFY * dprNow);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if(shake > 0) ctx.translate(Math.sin(tGlobal * 74) * 3.4 * shake, Math.cos(tGlobal * 61) * 2.2 * shake);
    drawField();
    drawPegs();
    drawBuckets();
    drawCannon();
    drawItems();
    drawBalls();
    drawEffects();
    drawCharge();
    drawUI();
    ctx.restore();
    if(hintOn && state === 'ready') drawHint();
  }

  /* ---------- 主循环 ---------- */
  function frame(ts){
    raf = requestAnimationFrame(frame);
    if(!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000; lastTs = ts;
    if(!(dt > 0)) dt = 1 / 60;
    dt = Math.min(dt, 1 / 20);
    step(dt);
    draw();
  }

  /* ---------- 布局（height:100% + 溢出兜底） ---------- */
  let layoutRetry = 0;               // 拿不到 stage 尺寸时的重试计数
  let layoutEstimated = false;       // 上一次布局是不是用「估算尺寸」画的
  let layoutSqueezed = false;        // 上一次布局有没有走「容器太矮」的兜底

  /** 容器太矮时给 <html> 挂个 class（CSS 里放开滚动）。classList 缺失的环境直接跳过 */
  function setSqueezed(on){
    const root = document.documentElement;
    if(!root || !root.classList) return;
    if(on) root.classList.add('squeezed'); else root.classList.remove('squeezed');
  }

  /** 顶部栏 + 底部控制条一共占掉多少竖高（兜底估算画布可用高度时要用） */
  function chromeHeight(){
    let h = 0;
    const t = $('topbar'), c = $('ctlbar');
    if(t) h += t.offsetHeight || 0;
    if(c) h += c.offsetHeight || 0;
    return h;
  }

  function layout(){
    const stage = $('stage');
    let availW = stage.clientWidth, availH = stage.clientHeight;
    /* ★ 黑屏兜底：预览面板（iframe）/ WebView 的首帧里 stage 常常还没尺寸。
     *   以前这里直接 return → 画布永远空着，用户看到的就是「一整片深色，底下只有按钮」。
     *   现在：① 拿窗口尺寸估一版先画出来；② 再排几次重试，等真实布局就位后重算。 */
    const noSize = !availW || !availH;
    if(noSize){
      if(!availW) availW = Math.max(240, (window.innerWidth || 360) - 8);
      if(!availH) availH = Math.max(240, (window.innerHeight || 640) - chromeHeight() - 10);
      if(layoutRetry < 40) setTimeout(() => { layoutRetry++; layout(); }, 80);
    }else{
      layoutRetry = 0;
    }
    /* ★ 容器太矮（预览面板塞在矮 iframe / 嵌入式视图里）：硬撑一块完整的场地出来，
     *   并放开页面滚动 —— 用户滚一下就能看到整个机台，而不是一片黑只剩按钮。 */
    const squeezed = availH < MIN_STAGE_H;
    if(squeezed){
      availH = MIN_STAGE_H;
      stage.style.height = MIN_STAGE_H + 'px';
    }else if(stage.style.height){
      stage.style.height = '';
    }
    setSqueezed(squeezed);
    layoutSqueezed = squeezed;
    // ★ 固定逻辑高：缩放由高度决定，逻辑宽随屏宽反推（见坐标系注释）
    // ★ 固定逻辑尺寸 + 居中留边：竖屏比例恒定，横屏时左右加黑边（关卡数据因此永远有效）
    S = Math.min(availH / HFIX, availW / WFIX);
    H = HFIX; W = WFIX;
    OFFX = (availW - W * S) / 2; OFFY = (availH - H * S) / 2;
    refit();
    const dpr = window.devicePixelRatio || 1;
    dprNow = dpr;
    cv.style.width = availW + 'px'; cv.style.height = availH + 'px';
    cv.width = Math.round(availW * dpr); cv.height = Math.round(availH * dpr);
    ctx.setTransform(S * dpr, 0, 0, S * dpr, OFFX * dpr, OFFY * dpr);
    // 溢出兜底：本模型下画布 css 恒等于 stage 尺寸、body 是 height:100%+overflow:hidden，
    // 理论上不可能溢出；万一 WebView 抽风，这里仍会走一次并因「改不动」立即退出（无死循环）。
    let guard = 0, prevH = document.documentElement.scrollHeight;
    while(prevH > window.innerHeight + 1 && guard++ < 10){
      S *= 0.985; H = HFIX; W = WFIX;
      OFFX = (availW - W * S) / 2; OFFY = (availH - H * S) / 2; refit();
      cv.style.width = availW + 'px'; cv.style.height = availH + 'px';
      cv.width = Math.round(availW * dpr); cv.height = Math.round(availH * dpr);
      ctx.setTransform(S * dpr, 0, 0, S * dpr, OFFX * dpr, OFFY * dpr);
      const nh = document.documentElement.scrollHeight;
      if(nh >= prevH) break;
      prevH = nh;
    }
    /* 尺寸从「估算」变成「真实」：钉场是按旧场地生成的，重生成一次
     *   （只在开局、还没发球时做，避免打断这一发） */
    if(layoutEstimated && !noSize && state === 'ready' && !flyers.length) genPegs();
    layoutEstimated = noSize;
    if(/[?&]debug/.test(location.search)) showDbg();
  }

  /* ---------- 音效开关 ---------- */
  $('btnSound').onclick = () => {
    soundOn = !soundOn;
    try{ localStorage.setItem('marble_sound', soundOn ? '1' : '0'); }catch(e){}
    setSoundLabel();
    if(!soundOn){ chargeOff(); if(bgmGain && ac) bgmGain.gain.setTargetAtTime(0, ac.currentTime, 0.06); }
    else { audio(); if(bgmTimer && bgmGain && ac) bgmGain.gain.setTargetAtTime(0.8, ac.currentTime, 0.06); }
    toast(soundOn ? '音效与音乐已开' : '音效与音乐已关');
  };
  function setSoundLabel(){ $('btnSound').textContent = soundOn ? '🔊 音效' : '🔇 音效'; }
  soundOn = localStorage.getItem('marble_sound') !== '0';
  $('overRetry').onclick = () => { chargeOff(); reset(); };

  /* ---------- 诊断（一键复制） ---------- */
  function dbgText(){
    const dpr = window.devicePixelRatio || 1;
    let vh100 = '?';
    try{
      const pr = document.createElement('div');
      pr.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:100vh;pointer-events:none';
      document.body.appendChild(pr);
      vh100 = Math.round(pr.getBoundingClientRect().height);
      document.body.removeChild(pr);
    }catch(e){}
    return [
      '【弹珠乐园·诊断】' + new Date().toLocaleString('zh-CN'),
      '视口=' + window.innerWidth + '×' + window.innerHeight + '  朝向=' + (window.innerWidth >= window.innerHeight ? '横屏' : '竖屏') + '  dpr=' + dpr,
      '高度探针: 100vh=' + vh100 + '  与可视差=' + (vh100 === '?' ? '?' : (vh100 - window.innerHeight)) + 'px',
      '画布css=' + cv.style.width + '×' + cv.style.height + '  物理=' + cv.width + '×' + cv.height,
      '逻辑=' + W + '×' + Math.round(H) + '  scale=' + S.toFixed(3) + '  桶口=' + mouthY + '  桶底=' + floorY,
      '页面总高=' + document.documentElement.scrollHeight + '/' + window.innerHeight,
      '状态=' + state + '  生命=' + lives + '  分数=' + score + '  发射=' + launched +
        '  累计得分=' + gain + '  最高分=' + best,
      '钉场=' + pegs.length + ' 颗(种子 ' + fieldSeed + ')  上一桶=' + lastBucket +
        (lastBucket >= 0 ? '(' + NUMS[lastBucket] + ')' : ''),
      '撞针分布=' + PEG_KINDS.map((K, i) => K.name + '(' + K.rest.toFixed(2) + ')×' + pegCounts()[i]).join(' ') +
        '  权重=' + pegMix.map(v => (v * 100).toFixed(0) + '%').join('/') + '  纵深偏置=' + pegTilt.toFixed(2),
      '道具刷新: 局初' + (ITEM_RUN_CHANCE * 100) + '% / 每回合' + (ITEM_ROUND_CHANCE * 100) +
        '%  寿命=' + ITEM_LIFE + '回合  场上 ' + items.length + '/' + ITEM_MAX,
      '撞针状态: 碎' + pegs.filter(p => p.dead).length + ' 冻' + pegs.filter(p => p.frozen).length +
        ' / 共' + pegs.length + ' 颗  寿命=' + PEG_LIFE + '回合',
      '金冠: ' + crownText() + '  默认筒=' + NUMS[CROWN_DEF_I] + '号(' + CROWN_DEF_I + ')' +
        '  移动几率=' + (CROWN_MOVE_CHANCE * 100) + '%',
      '上一球: 出膛=' + lastSpeed.toFixed(0) + ' 力量=' + (lastSpeed > 0 ? Math.round((lastSpeed - MINV) / (MAXV - MINV) * 100) + '%' : '—') +
        '  撞钉=' + pegHits + '  在飞=' + (flyers.length ? flyers.length + '球 ' +
          Math.round(Math.max.apply(null, flyers.map(b2 => b2.flightT)) * 100) / 100 + 's' : '否') +
        '  道具=' + items.length + '(' + items.map(i2 => i2.kind).join(',') + ')' +
        '  回合效果=' + (fx.L ? 'L' + fx.L : '') + (fx.R ? 'R' + fx.R : '') + (fx.perm ? '错位' : '') +
        (fx.sealed.some(Boolean) ? '封' + fx.sealed.filter(Boolean).length : '') +
        (entranceActive() ? '(还剩' + (fx.life | 0) + '回合)' : '') +
        '  本回合累计=' + roundGain + '  炮口=' + aim.toFixed(2) + 'rad',
      '区间: 力量0%=' + MINV + ' 100%=' + MAXV + '  重力=' + G + '  钉r=' + RP + ' 球r=' + RB,
      '音效=' + (soundOn ? '开' : '关') + '  BGM=' + (bgmTimer ? '播放中' : '停'),
      'UA=' + navigator.userAgent,
    ].join('\n');
  }
  function copyText(txt){
    let done = false;
    try{
      if(navigator.clipboard && window.isSecureContext && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); done = true; }
    }catch(e){ done = false; }
    if(!done){
      try{
        const ta = document.createElement('textarea');
        ta.value = txt; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta); ta.select();
        if(ta.setSelectionRange) ta.setSelectionRange(0, txt.length);
        done = document.execCommand('copy');
        document.body.removeChild(ta);
      }catch(e){ done = false; }
    }
    if(!done){
      try{
        const rg = document.createRange(); rg.selectNodeContents($('dbg'));
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
      }catch(e){}
    }
    toast(done ? '诊断信息已复制 ✓ 直接粘给开发者' : '已选中，长按选择「复制」');
    return done;
  }
  function showDbg(){ const el = $('dbg'); el.classList.add('on'); el.textContent = dbgText(); return el.textContent; }
  $('btnDiag').addEventListener('click', e => { e.stopPropagation(); copyText(showDbg()); });
  $('dbg').addEventListener('click', e => { e.stopPropagation(); copyText(showDbg()); });

  function toast(msg){
    const t = $('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1700);
  }

  /* ---------- 启动 ---------- */
  setSoundLabel();
  layout();
  /* ⚠️ 这里原来是 reset(1)（固定种子「首局可预期」）—— 那是个**真 bug**：
   *   玩家反馈「玩了好久都没见过金冠改变位置」，根因就在这 ——
   *   固定种子意味着**每次刷新页面/第一次打开看到的都是同一局**：
   *   同一个钉阵、同一个金冠位置（永远 8 号筒）。
   *   只在手机上用「刷新」而很少点「再来一次」的玩家，就永远看不到金冠挪窝。
   *   现在改成：首次进页面也用**随机种子**（跟「再来一次」一致）。
   *   要复现某一局时，用 __marbleReset(seed) 或 URL 上的 ?seed= 即可。 */
  const urlSeed = (function(){
    try{
      const m = /[?&]seed=(-?\d+)/.exec(location.search);
      return m ? (parseInt(m[1], 10) | 0) : null;
    }catch(e){ return null; }
  })();
  reset(urlSeed === null ? undefined : urlSeed);   // 无参 → 随机种子（每局都不同）
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 250));
  /* ★ 预览面板（iframe）里 window 不一定 resize，但 stage 的尺寸会变 —— 盯住它 */
  if(window.ResizeObserver){
    try{ new ResizeObserver(() => layout()).observe($('stage')); }catch(e){}
  }
  if(!raf) raf = requestAnimationFrame(frame);

  /* ---------- 测试钩子 ---------- */
  window.__marble = () => ({
    state, lives, score, launched, gain, best, lastBucket, pegHits, flights,
    /* 兼容旧名：balls = 生命、runPeak = 分数（分数与生命分开前的旧语义） */
    balls: lives, runPeak: score,
    lastSpeed, charge, charging, hintOn, soundOn, HINT_H,
    NUMS: NUMS.slice(), START_BALLS, START_LIVES, SCORE_MULT, MINV, MAXV, CHARGE_T,
    WALL_PEG_GAP,
    WIN_I, crownI, CROWN_DEF_I, CROWN_MOVE_CHANCE, crownFlash,
    G, RB, RP, REST_PEG, REST_WALL, FLIGHT_CAP,
    W, H, fieldL, fieldR, fieldT, mouthY, floorY, slotW, cannonX: CANNON_X,
    pegCount: pegs.length, fieldSeed,
    pegs: pegs.map(p => ({ x: p.x, y: p.y, i: p.i, k: p.k, rest: (PEG_KINDS[p.k] || PEG_KINDS[1]).rest,
                           dead: !!p.dead, frozen: !!p.frozen, life: p.life | 0,
                           last: pegStateLast(p) })),
    pegMix: pegMix.slice(), pegDist: pegCounts(), pegTilt,
    PEG_KINDS: PEG_KINDS.map(k => ({ key: k.key, name: k.name, rest: k.rest })), PEG_CAP: PEG_CAP.slice(),
    SPD_CAP, ITEM_RUN_CHANCE, ITEM_ROUND_CHANCE, MIN_STAGE_H, squeezed: layoutSqueezed,
    flyers: flyers.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, flightT: b.flightT,
                               fire: b.fire, iceT: b.iceT, splitLv: b.splitLv, dead: b.dead })),
    ball: flyers[0] ? { x: flyers[0].x, y: flyers[0].y, vx: flyers[0].vx, vy: flyers[0].vy,
                        flightT: flyers[0].flightT } : null,
    items: items.map(it => ({ id: it.id, x: it.x, y: it.y, kind: it.kind, life: it.life })),
    ITEM_LIFE, ITEM_MAX, PEG_LIFE, ENTRANCE_LIFE, SEAL_MAX,
    itemsOn, roundGain, roundPegHits, clownDone, aim, aimDir,
    fx: { L: fx.L, R: fx.R, shuffle: !!fx.perm, perm: fx.perm ? fx.perm.slice() : null,
          sealed: fx.sealed.slice(), life: fx.life | 0, active: entranceActive() },
    effNums: effNums(),
    AIM_MAX, ITEM_R, MAX_FLYERS, MAX_STACK, MINE_R, FIRE_R, ICE_R, ICE_TIME,
    SPLIT_N, SPLIT_MAX_LV, ITEM_FONT: Object.assign({}, ITEM_FONT),
    bgm: !!bgmTimer,
  });
  window.__marbleSetStage = (w, h) => { const st = document.getElementById('stage'); st.clientWidth = w; st.clientHeight = h; layout(); return { W: W, H: H, S: S }; };
  window.__marbleStep = dt => step(dt);
  window.__marbleReset = seed => { chargeOff(); reset(seed); };
  window.__marblePress = () => pressStart();
  window.__marbleRelease = () => pressEnd();
  window.__marbleSetCharge = c => { charge = clamp(c, 0, 1); };
  /* 直接按桶结算（测规则用）：落桶 + 收尾，语义和「这一发打完」一致。
   * 返回的 n = 桶上的原始数字；gained = 实际得分（n × SCORE_MULT）。两者都要给，
   * 测试才能同时验证「桶面数字」和「乘过倍率的分数」。 */
  window.__marbleLand = i => {
    if(!flyers.length) flyers = [mkBall(CANNON_X, CANNON_MOUTH, 0, 0)];
    const n = landBucket(flyers[0], clamp(i | 0, 0, NUMS.length - 1));
    settleFlyers();
    return { n, gained: n * SCORE_MULT, lives, balls: lives, score, gain, roundGain };
  };
  window.__marbleSetBall = o => {                     // 测物理用（卡死看门狗等）
    flyers = [ mkBall(o.x, o.y, o.vx || 0, o.vy || 0) ];
    state = 'play';
  };
  window.__marbleSetAim = a => { aim = clamp(+a || 0, -AIM_MAX, AIM_MAX); return aim; };
  /* ★ 模拟「按住方向键」：真实 keydown 分支是 `aimDir = dir; closeHint();`，
   *   钩子必须照做，否则测试测的就不是真实路径了（曾经漏掉 closeHint） */
  window.__marbleAimDir = d => { aimDir = +d || 0; if(aimDir) closeHint(); };
  window.__marbleFire = c => { fire(clamp(c === undefined ? 0 : +c, 0, 1)); return flyers.length; };
  window.__marblePutItem = (kind, x, y, life) => {
    const it = { id: ++itemSeq, x, y, kind, t: 0, life: life === undefined ? ITEM_LIFE : (life | 0) };
    items.push(it); return it.id;
  };
  /* 实验用：强指定撞针分布（mix=4 档权重、tilt=纵深偏置），并立刻重生成钉场 */
  window.__marblePegMix = (mix, tilt) => {
    if(Array.isArray(mix) && mix.length === PEG_KINDS.length) pegMix = mix.slice();
    if(typeof tilt === 'number') pegTilt = tilt;
    genPegs();
    return { mix: pegMix.slice(), dist: pegCounts(), tilt: pegTilt };
  };
  window.__marbleClearItems = () => { items = []; };
  window.__marbleEat = (kind, idx) => {              // 让第 idx 个球直接吃到某道具
    if(!flyers.length) flyers = [mkBall(CANNON_X, CANNON_MOUTH, 0, 120)];
    const b = flyers[Math.min(idx || 0, flyers.length - 1)];
    const label = applyItem(b, kind);
    if(flyers.some(x => x.dead)) settleFlyers();
    return label;
  };
  window.__marbleAddPegHits = n => { roundPegHits += (n | 0); return roundPegHits; };
  window.__marbleExplode = (x, y, r, kill) => explode(x, y, r === undefined ? MINE_R : r, !!kill);
  window.__marbleChainMax = () => CHAIN_MAX;
  window.__marbleCrownText = () => crownText();
  window.__marbleSetCrown = i => { crownI = clamp(i | 0, 0, NUMS.length - 1); return crownI; };
  /* 把某颗钉挪到指定坐标（测试「墙边钉挤住球」的反证场景用） */
  window.__marbleSetPegPos = (idx, x, y) => {
    const p = pegs[idx]; if(!p) return null;
    p.x = +x; p.y = +y;
    return { x: p.x, y: p.y };
  };

  /* ★ 玩法提示：位置与关闭（测试用） */
  window.__marbleHintRect = () => hintRect();
  window.__marbleHintCloseBtn = () => hintCloseBtn();
  window.__marbleCloseHint = () => closeHint();
  window.__marbleHintTap = () => closeHint();       // 模拟「轻点画面关闭」
  window.__marbleEndRound = () => endRound();
  window.__marbleDraw = () => { draw(); return true; };
  window.__marbleSpawnItems = k => { spawnItems(k); return items.length; };
  window.__marbleItemAlpha = life => itemAlpha({ life: life | 0 });
  window.__marbleItemMeta = kind => {
    const m = ITEMS[kind]; if(!m) return null;
    return { key: kind, txt: m.txt, color: m.color, ink: m.ink, name: m.name, shape: m.shape || 'plate' };
  };
  window.__marbleMineVisual = () => ({ shape: ITEMS.MINE.shape, R: ITEM_R + 1.2, blastR: MINE_R, ITEM_R });
  window.__marbleEntranceActive = () => entranceActive();
  window.__marbleEntranceEdge = () => entranceEdge();
  window.__marbleClearFx = () => { fx = clearFx(); return true; };
  window.__marblePegStateLast = life => pegStateLast({ life: life | 0, dead: true });
  window.__marblePegPulse = () => pegStatePulse({ i: 0 });
  /* 直接给某颗钉设置状态（测「寿命保持」用，绕开物理的不确定性） */
  window.__marbleSetPeg = (idx, state, life) => {
    const p = pegs[idx]; if(!p) return null;
    if(state === 'dead') killPeg(p);
    else if(state === 'frozen') freezePeg(p);
    else { p.dead = false; p.frozen = false; p.life = 0; }
    if(life !== undefined) p.life = life | 0;
    return { dead: p.dead, frozen: p.frozen, life: p.life };
  };
})();
</script>
</body>
</html>

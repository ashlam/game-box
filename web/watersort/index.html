<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>倒水分拣 · 小游戏盒子</title>
<style>
  :root{ --bg:#0f1115; --panel:#161a22; --line:#242b36; --text:#e8edf5; --dim:#8b97a8; --pri:#5b8cff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--bg); color:var(--text); font:15px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
        display:flex; flex-direction:column; overflow:hidden; user-select:none; -webkit-user-select:none; }
  .top{ display:flex; align-items:center; gap:8px; padding:8px 10px 6px; flex:0 0 auto; }
  .top a.back{ color:var(--dim); text-decoration:none; font-size:22px; padding:2px 6px; border-radius:8px; }
  .top h1{ font-size:14px; margin:0; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .top .hud{ font-size:13px; color:var(--dim); white-space:nowrap; }
  .top .hud b{ color:var(--text); font-weight:650; }
  .top .sp{ flex:1; }
  .top button{ font:inherit; font-size:13px; padding:7px 11px; border-radius:10px; border:1px solid var(--line);
               background:#1b212b; color:var(--text); }
  .top button.off{ opacity:.42 }
  .top button.undo-ready{ background:#22304a; border-color:#3d5a8f; color:#fff }
  #stage{ flex:1 1 auto; position:relative; min-height:0; overflow:hidden; }
  #cv{ display:block; touch-action:none; }
  .ov{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:16px;
       background:rgba(8,10,14,.82); z-index:6; }
  .ov.on{ display:flex }
  .card{ width:min(92%,340px); background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; text-align:center; }
  .card h2{ margin:0 0 6px; font-size:19px; }
  .card .sub{ color:var(--dim); font-size:13px; margin-bottom:10px; }
  .card .rec{ color:#ffd166; font-size:13px; font-weight:650; margin-bottom:12px; }
  .card .row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .card button{ font:inherit; padding:10px 14px; border-radius:11px; border:1px solid var(--line); background:#1d2430; color:var(--text); }
  .card button.pri{ background:#2b4a86; border-color:#3f66b0; color:#fff; font-weight:650 }
  #menu{ position:absolute; inset:0; display:none; background:rgba(8,10,14,.8); z-index:7; padding:14px; overflow:auto; }
  #menu.on{ display:block }
  #menu .grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; max-width:340px; margin:40px auto 0; }
  #menu button{ font:inherit; padding:14px 8px; border-radius:12px; border:1px solid var(--line); background:#1d2430; color:var(--text); }
  #lv{ position:absolute; inset:0; display:none; background:rgba(8,10,14,.85); z-index:8; padding:12px; overflow:auto; }
  #lv.on{ display:block }
  .tabs{ display:flex; gap:6px; justify-content:center; margin:8px 0 12px; flex-wrap:wrap }
  .tabs button{ font:inherit; font-size:13px; padding:7px 12px; border-radius:9px; border:1px solid var(--line); background:#1b212b; color:var(--dim) }
  .tabs button.on{ background:#22304a; border-color:#3d5a8f; color:#fff }
  .lvgrid{ display:grid; grid-template-columns:repeat(6,1fr); gap:7px; max-width:360px; margin:0 auto }
  .lvgrid button{ font:inherit; padding:9px 0; border-radius:10px; border:1px solid var(--line); background:#1b212b; color:var(--text); font-size:13px }
  .lvgrid button.on{ background:#22304a; border-color:#3d5a8f }
  .lvgrid button.done{ color:#7fe0a8; border-color:#2f5c46; background:#16261f }
  .lvclose{ display:block; margin:14px auto 4px; font:inherit; padding:10px 22px; border-radius:11px; background:#1d2430; color:var(--text); border:1px solid var(--line) }
  #dbg{ position:absolute; left:6px; bottom:6px; font:11px/1.35 ui-monospace,Menlo,monospace; color:#7f8b9c;
        background:rgba(0,0,0,.45); padding:5px 7px; border-radius:7px; display:none; white-space:pre; pointer-events:none; z-index:5 }
  #toast{ position:absolute; left:50%; top:14%; transform:translateX(-50%); background:rgba(20,24,32,.95);
          border:1px solid var(--line); color:var(--text); padding:9px 14px; border-radius:11px; font-size:13.5px;
          opacity:0; transition:.22s; pointer-events:none; max-width:90%; text-align:center; z-index:9 }
  #toast.on{ opacity:1 }
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="/">‹</a>
    <h1>倒水分拣 <span class="hud" id="hud">—</span></h1>
    <span class="sp"></span>
    <button id="btnUndo">↶ 撤销</button>
    <button id="btnMenu">☰</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <div id="dbg"></div>

    <div class="ov" id="over">
      <div class="card">
        <h2 id="overTitle">过关！</h2>
        <div class="sub" id="overSub"></div>
        <div class="rec" id="overText"></div>
        <div class="row">
          <button id="overRetry">再来一次</button>
          <button id="overNext" class="pri">下一关 →</button>
        </div>
      </div>
    </div>

    <div id="menu">
      <div class="grid">
        <button id="mReset">⟲ 重置本关</button>
        <button id="mHint">💡 提示</button>
        <button id="mDemo">▶ 自动演示</button>
        <button id="mLv">☰ 选关</button>
        <button id="mSound">🔊 音效</button>
        <button id="mDiag">诊断</button>
        <button id="mClose">✕ 关闭</button>
      </div>
    </div>

    <div id="lv">
      <div class="tabs" id="tabs"></div>
      <div class="lvgrid" id="lvgrid"></div>
      <button class="lvclose" id="lvClose">关闭</button>
    </div>
  </div>

  const cv = $('cv'), ctx = cv.getContext('2d');
  const stage = $('stage');
  let S = 1, dprNow = 1, OFFX = 0, OFFY = 0, cvRect = null;
  let Wc = W, Hc = HFIX;

  /* ---------- 状态 ---------- */
  let setId = 0, lvIdx = 0;
  let tubes = [], start = [], history = [], steps = 0;
  let state = 'play', best = 0;
  let anim = null, flows = [], shake = 0, pops = [], glowT = 0;
  let sel = -1, hoverTube = -1, dragT = null;
  let demo = null, demoPaused = false, hintOn = false, hintT = 0, hintMove = null;
  let soundOn = true, dbgOn = false;
  let geo = { tw: 40, th: 150, gap: 12, rowGap: 20, cols: 4, x0: 0, y0: 0 };

  const curSet = () => LEVEL_SETS[setId] || { id:'x', name:'?', stars:1, levels:[] };
  const curLevel = () => (curSet().levels[lvIdx]) || { id:1, stars:1, min:0, tubes:[[],[]], sol:[] };
  const SV = 'v1';
  const clearKey = (s, i) => 'watersort_cleared_' + SV + '_' + LEVEL_SETS[s].id + '_' + LEVEL_SETS[s].levels[i].id;
  const bestKey  = (s, i) => 'watersort_best_' + SV + '_' + LEVEL_SETS[s].id + '_' + LEVEL_SETS[s].levels[i].id;
  const getNum = k => { const v = localStorage.getItem(k); return v == null ? 0 : (parseInt(v, 10) || 0); };
  const setNum = (k, v) => { try{ localStorage.setItem(k, String(v)); }catch(e){} };

  /* ---------- 音效（现场合成，无外部资源） ---------- */
  let AC = null, master = null;
  function audio(){
    if(AC) return AC;
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    AC = new C();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    return AC;
  }
  function tone(freq, dur, type, vol, at){
    if(!soundOn || !AC) return;
    const t0 = AC.currentTime + (at || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol == null ? 0.18 : vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, freq, q, vol, at){
    if(!soundOn || !AC) return;
    const t0 = AC.currentTime + (at || 0);
    const n = Math.max(1, Math.floor(AC.sampleRate * dur));
    const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = AC.createBufferSource(); src.buffer = buf;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq || 700; bp.Q.value = q || 2.2;
    const g = AC.createGain(); g.gain.value = vol == null ? 0.16 : vol;
    src.connect(bp); bp.connect(g); g.connect(master); src.start(t0);
  }
  const sndPick  = () => { tone(560, 0.08, 'sine', 0.12); };
  const sndPour  = k => { noise(0.09, 520 + k * 70, 2.6, 0.13); tone(320 + k * 40, 0.1, 'sine', 0.07, 0.01); };
  const sndBlocked = () => { tone(150, 0.14, 'sawtooth', 0.12); };
  const sndUndo  = () => { tone(420, 0.07, 'sine', 0.12); tone(300, 0.1, 'sine', 0.1, 0.05); };
  const sndWin   = () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.32, 'triangle', 0.16, i * 0.09)); };
  const sndClick = () => { tone(680, 0.05, 'square', 0.07); };

  /* ---------- 规则 ---------- */
  function topRun(t){
    if(!t.length) return 0;
    const c = t[t.length - 1]; let n = 1;
    while(n < t.length && t[t.length - 1 - n] === c) n++;
    return n;
  }
  function canPour(from, to){
    if(from === to) return 0;
    const a = tubes[from], b = tubes[to];
    if(!a || !a.length) return 0;
    if(b.length >= CAP) return 0;
    if(b.length && b[b.length - 1] !== a[a.length - 1]) return 0;
    const run = topRun(a);
    if(!b.length && run === a.length) return 0;      // 纯色管倒进空管 = 无意义
    if(a.length === CAP && run === CAP) return 0;    // 已整理好的管不再动
    return Math.min(run, CAP - b.length);
  }
  function isDone(){
    return tubes.every(t => t.length === 0 || (t.length === CAP && t.every(c => c === t[0])));
  }
  function snapshot(){
    return { tubes: tubes.map(t => t.slice()), steps: steps, hist: history.length };
  }
  function restore(snap){
    tubes = snap.tubes.map(t => t.slice());
    steps = snap.steps;
    state = 'play';
    sel = -1; flows = []; anim = null;
    $('over').classList.remove('on');
    syncUndoBtn();
  }

  /* ---------- 倒水 ---------- */
  function doPour(from, to, silent){
    const k = canPour(from, to);
    if(k <= 0) return 0;
    if(!demo){
      history.push({ tubes: tubes.map(t => t.slice()), steps: steps });
      if(history.length > 300) history.shift();
    }
    const col = tubes[from][tubes[from].length - 1];
    for(let i = 0; i < k; i++) tubes[to].push(tubes[from].pop());
    steps += 1;
    if(!silent) for(let i = 0; i < k; i++) setTimeout(() => sndPour(i), i * 55);
    flows.push({ to, color: col, k, t: 0 });
    syncUndoBtn();
    // ★ 倒完之后必须检查通关（否则玩家永远看不到过关面板）。
    //   finish() 内部自己延迟约 0.85s 再弹面板，让倒水动画先播完。
    //   演示中由演示逻辑自己收尾（不计玩家成绩）。
    if(!demo && isDone()) finish();
    return k;
  }
  function undo(){
    if(demo){ toast('演示进行中：请先退出演示'); return 0; }
    if(!history.length){ toast('没有可撤销的步骤'); sndBlocked(); return 0; }
    const h = history.pop();
    tubes = h.tubes.map(t => t.slice());
    steps = h.steps;
    state = 'play'; sel = -1;
    $('over').classList.remove('on');
    sndUndo(); syncUndoBtn();
    return 1;
  }
  function finish(){
    state = 'won'; glowT = 1; shake = 0.5; sndWin();
    const lv = curLevel();
    const rec = !best || steps < best;
    if(rec) best = steps;
    if(!demo){
      if(rec) setNum(bestKey(setId, lvIdx), steps);
      setNum(clearKey(setId, lvIdx), 1);
    }
    pops.push({ t: 0, txt: '分拣完成！' + steps + ' 步', color: '#7fe0a8' });
    setTimeout(() => { if(state === 'won' && !demo) showPanel(); }, 850);
  }
  function nextLevel(){
    $('over').classList.remove('on');
    if(lvIdx + 1 < curSet().levels.length) lvIdx++;
    else if(setId + 1 < LEVEL_SETS.length){ setId++; lvIdx = 0; toast('进入「' + curSet().name + '」第 1 关'); }
    loadLevel(setId, lvIdx);
  }
  function showPanel(){
    const lv = curLevel();
    $('overTitle').textContent = '过关！' + curSet().name + ' · 第 ' + lv.id + ' 关';
    $('overSub').textContent = (lv.stars ? '★'.repeat(lv.stars) + ' · ' : '') + '本关最少 ' + lv.min + ' 步 · ' + lv.colors + ' 色';
    const rec = (best === steps) && steps > 0;
    $('overText').textContent = rec ? '★ 新纪录！用了 ' + steps + ' 步' : '你的记录 ' + (getNum(bestKey(setId, lvIdx)) || '—') + ' 步';
    $('overText').className = rec ? 'rec' : '';
    const setDone = lvIdx + 1 >= curSet().levels.length;
    const nextSet = setId + 1 < LEVEL_SETS.length ? LEVEL_SETS[setId + 1] : null;
    $('overNext').style.display = (!setDone || nextSet) ? '' : 'none';
    if(setDone && nextSet){
      $('overText').textContent += '　★ ' + curSet().name + '全部通关！';
      $('overNext').textContent = '进入「' + nextSet.name + '」第 1 关 →';
    } else if(setDone){
      $('overText').textContent += '　★ 全部关卡通关，厉害！';
      $('overNext').textContent = '下一关 →';
    } else {
      $('overNext').textContent = '下一关 →';
    }
    $('over').classList.add('on');
  }

  /* ---------- 布局 ---------- */
  function layout(){
    const availW = stage.clientWidth || 360, availH = stage.clientHeight || 560;
    S = Math.min(availH / HFIX, availW / W);
    Wc = W; Hc = HFIX;
    OFFX = (availW - Wc * S) / 2; OFFY = (availH - Hc * S) / 2;
    cvRect = null;                         // ★ 尺寸变了 → 缓存的显示矩形作废
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    dprNow = dpr;
    cv.style.width = availW + 'px'; cv.style.height = availH + 'px';
    cv.width = Math.round(availW * dpr); cv.height = Math.round(availH * dpr);
    fit();
  }
  function fit(){
    const n = Math.max(1, tubes.length);
    const rows = n <= 5 ? 1 : 2;
    const cols = Math.ceil(n / rows);
    const padX = 12, topBar = 46, bottomPad = 26, shelfH = 14;
    const usableW = Wc - padX * 2;
    const usableH = Hc - topBar - bottomPad - (rows - 1) * 8;
    // 试管：宽 : 高 ≈ 1 : 3.5（含管口）；水格高 = 管身/4
    const gapX = Math.max(7, Math.min(16, usableW / cols * 0.22));
    let tw = (usableW - gapX * (cols - 1)) / cols;
    let th = tw * 3.5;
    const rowSpace = (usableH - shelfH) / rows - 10;
    if(th > rowSpace){ th = rowSpace; tw = th / 3.5; }
    th = Math.max(70, th); tw = Math.max(20, tw);
    const totalW = tw * cols + gapX * (cols - 1);
    const totalH = th * rows + (rows - 1) * 14;
    geo = { tw: tw, th: th, gap: gapX, cols: cols, rows: rows,
            x0: (Wc - totalW) / 2, y0: topBar + Math.max(0, (usableH - shelfH - totalH) / 2),
            rowGap: 14, shelfH: shelfH };
  }
  function tubeXY(i){
    const r = Math.floor(i / geo.cols), c = i % geo.cols;
    const inRow = Math.min(geo.cols, Math.max(0, tubes.length - r * geo.cols));
    const rowW = geo.tw * inRow + geo.gap * (inRow - 1);
    const rx = (Wc - rowW) / 2;
    return { x: rx + c * (geo.tw + geo.gap), y: geo.y0 + r * (geo.th + geo.rowGap), w: geo.tw, h: geo.th };
  }
  function tubeAt(lx, ly){
    for(let i = 0; i < tubes.length; i++){
      const b = tubeXY(i);
      if(lx >= b.x - 4 && lx <= b.x + b.w + 4 && ly >= b.y - 10 && ly <= b.y + b.h + 8) return i;
    }
    return -1;
  }

  /* ---------- 触摸：逻辑坐标换算（★ 必须减留边、除缩放，转屏才对） ---------- */
  function toLogical(clientX, clientY){
    if(!cvRect) cvRect = cv.getBoundingClientRect();
    const bx = (cv.width / dprNow) || 1, by = (cv.height / dprNow) || 1;
    const kx = (cvRect.width || bx) / bx, ky = (cvRect.height || by) / by;
    return { x: ((clientX - cvRect.left) / kx - OFFX) / S,
             y: ((clientY - cvRect.top) / ky - OFFY) / S };
  }
  function onDown(clientX, clientY){
    if(state === 'won' || demo) return;
    const p = toLogical(clientX, clientY);
    const i = tubeAt(p.x, p.y);
    if(i < 0) return;
    const a = tubes[i];
    if(sel >= 0 && sel !== i){
      const k = doPour(sel, i);
      if(k > 0){ sel = -1; return; }
      if(!a.length){ toast('空管不能作为起点'); sndBlocked(); sel = -1; return; }
      sel = i; sndPick(); return;
    }
    if(sel === i){ sel = -1; return; }
    if(!a.length){ toast('空管不能作为起点'); sndBlocked(); return; }
    if(a.length === CAP && topRun(a) === CAP){ toast('这管已经整理好了'); sndBlocked(); return; }
    sel = i; sndPick();
    dragT = { from: i, x: p.x, y: p.y };
  }
  function onMove(clientX, clientY){
    if(state === 'won' || demo || !dragT) return;
    const p = toLogical(clientX, clientY);
    const j = tubeAt(p.x, p.y);
    hoverTube = j;
    if(j >= 0 && j !== dragT.from && canPour(dragT.from, j) > 0){
      doPour(dragT.from, j);
      dragT = null; sel = -1; hoverTube = -1;
    }
  }
  function onUp(){ dragT = null; hoverTube = -1; }

  function bindPointer(){
    cv.addEventListener('pointerdown', e => { cvRect = null; audio(); onDown(e.clientX, e.clientY); });
    cv.addEventListener('pointermove', e => { onMove(e.clientX, e.clientY); });
    cv.addEventListener('pointerup', () => onUp());
    cv.addEventListener('pointercancel', () => onUp());
    cv.addEventListener('pointerleave', () => onUp());
    window.addEventListener('resize', () => { layout(); });
    window.addEventListener('orientationchange', () => setTimeout(layout, 120));
  }

  /* ---------- 绘制 ---------- */
  function rr(c, x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }
  const COL = i => COLORS[i % COLORS.length];

  function drawTubeBox(x, y, w, h, highlight){
    const r = w * 0.42;
    // 管身：半透明玻璃
    ctx.save();
    const g = ctx.createLinearGradient(x, y, x + w, y);
    g.addColorStop(0, 'rgba(235,242,255,.30)');
    g.addColorStop(0.42, 'rgba(255,255,255,.13)');
    g.addColorStop(1, 'rgba(200,215,240,.22)');
    ctx.fillStyle = g;
    rr(ctx, x, y, w, h, r); ctx.fill();
    // 描边
    ctx.lineWidth = Math.max(1.4, w * 0.055);
    ctx.strokeStyle = highlight ? 'rgba(160,205,255,.95)' : 'rgba(200,218,245,.62)';
    rr(ctx, x, y, w, h, r); ctx.stroke();
    if(highlight){ ctx.shadowColor = 'rgba(120,190,255,.85)'; ctx.shadowBlur = 12; rr(ctx, x, y, w, h, r); ctx.stroke(); ctx.shadowBlur = 0; }
    // 左侧高光条
    ctx.fillStyle = 'rgba(255,255,255,.30)';
    rr(ctx, x + w * 0.15, y + h * 0.10, w * 0.13, h * 0.55, w * 0.065); ctx.fill();
    // 管口椭圆
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + r * 0.30, w * 0.50, h * 0.018 + w * 0.055, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(215,230,255,.55)'; ctx.lineWidth = Math.max(1, w * 0.035); ctx.stroke();
    ctx.restore();
  }
  function drawWater(u, col, i){
    if(u.len <= 0) return;
    const { x, y, w, h } = u;                       // u = 这一格的区域
    const pad = Math.max(2.2, w * 0.10);
    const rw = w - pad * 2, rh = h - Math.max(2, h * 0.10);
    const isTop = i === u.total - 1;
    ctx.save();
    const g = ctx.createLinearGradient(x + pad, y, x + pad + rw, y + rh);
    g.addColorStop(0, col);
    g.addColorStop(0.55, col);
    g.addColorStop(1, shade(col, -0.18));
    ctx.fillStyle = g;
    rr(ctx, x + pad, y + rh * 0.06, rw, rh, Math.min(rw * 0.34, rh * 0.42));
    ctx.fill();
    // 顶部液面亮线（只有最上面一格画）
    if(isTop){
      ctx.fillStyle = 'rgba(255,255,255,.42)';
      rr(ctx, x + pad + rw * 0.06, y + rh * 0.12, rw * 0.88, Math.max(1.4, rh * 0.10), rh * 0.05);
      ctx.fill();
    }
    ctx.restore();
  }
  function shade(hex, amt){
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, Math.round(r + 255 * amt)));
    g = Math.max(0, Math.min(255, Math.round(g + 255 * amt)));
    b = Math.max(0, Math.min(255, Math.round(b + 255 * amt)));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function draw(){
    ctx.setTransform(S * dprNow, 0, 0, S * dprNow, OFFX * dprNow, OFFY * dprNow);
    ctx.clearRect(0, 0, Wc, Hc);
    // 背景
    const bg = ctx.createLinearGradient(0, 0, 0, Hc);
    bg.addColorStop(0, '#1b2030'); bg.addColorStop(0.55, '#171c28'); bg.addColorStop(1, '#12151d');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, Wc, Hc);

    // 台面线（下排试管底下那条，参考图里是暖粉色）
    if(geo.rows >= 2){
      const yShelf = geo.y0 + geo.th + geo.rowGap * 0.5;
      const sg = ctx.createLinearGradient(0, yShelf - 3, 0, yShelf + 5);
      sg.addColorStop(0, 'rgba(240,150,190,.85)'); sg.addColorStop(1, 'rgba(200,90,150,.45)');
      ctx.fillStyle = sg;
      rr(ctx, 16, yShelf - 2.2, Wc - 32, 4.4, 2.2); ctx.fill();
    }

    // 试管 + 水
    const unit = (geo.th - geo.tw * 0.5) / CAP;      // 管身可用高度 / 容量
    const baseY = geo.tw * 0.34;                     // 管口下沿
    for(let i = 0; i < tubes.length; i++){
      const b = tubeXY(i);
      const isSel = (i === sel), isHover = (i === hoverTube && dragT);
      drawTubeBox(b.x, b.y, b.w, b.h, isSel || isHover);
      const t = tubes[i];
      for(let k = 0; k < t.length; k++){
        const yy = b.y + baseY + (CAP - 1 - k) * unit;
        drawWater({ x: b.x, y: yy, w: b.w, h: unit, len: 1, total: t.length },
                  COL(t[k]), k);
      }
      if(isSel){                                    // 选中：箭头提示可倒方向
        ctx.save();
        ctx.fillStyle = 'rgba(255,214,102,.95)';
        const cx = b.x + b.w / 2;
        ctx.beginPath();
        ctx.moveTo(cx - 7, b.y - 12); ctx.lineTo(cx + 7, b.y - 12); ctx.lineTo(cx, b.y - 4);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    // 倒水动画（从源管口流向目标管）
    for(const f of flows){
      const k = Math.min(1, f.t / 0.34);
      const a = tubeXY(f.j !== undefined ? f.j : 0);
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = COL(f.color);
      ctx.lineWidth = 6 * (1 - k * 0.4);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x + a.w / 2, a.y - 4 - 22 * k);
      ctx.lineTo(a.x + a.w / 2, a.y + 8); ctx.stroke();
      ctx.restore();
    }
    // 浮字
    for(const p of pops){
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.5);
      ctx.fillStyle = p.color; ctx.font = '600 20px -apple-system,PingFang SC,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.txt, Wc / 2, Hc * 0.42 - p.t * 34);
      ctx.restore();
    }
    if(glowT > 0){
      ctx.save();
      ctx.globalAlpha = glowT * 0.5;
      const rg = ctx.createRadialGradient(Wc / 2, Hc * 0.45, 10, Wc / 2, Hc * 0.45, Wc * 0.75);
      rg.addColorStop(0, 'rgba(127,224,168,.55)'); rg.addColorStop(1, 'rgba(127,224,168,0)');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, Wc, Hc);
      ctx.restore();
    }
    if(dbgOn){
      $('dbg').style.display = 'block';
      $('dbg').textContent = '视口 ' + stage.clientWidth + '×' + stage.clientHeight + ' · 逻辑 ' + Wc + '×' + Hc +
        '\nscale ' + S.toFixed(3) + ' · 留边 ' + Math.round(OFFX) + '/' + Math.round(OFFY) +
        '\n' + geo.rows + '行×' + geo.cols + '列 · 管 ' + geo.tw.toFixed(1) + '×' + geo.th.toFixed(1) +
        '\n管数 ' + tubes.length + ' · 步数 ' + steps + ' · 撤销栈 ' + history.length;
    }
  }

  /* ---------- 帧循环 ---------- */
  let last = 0;
  function frame(ts){
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    if(shake > 0) shake = Math.max(0, shake - dt * 2.2);
    for(const f of flows) f.t += dt;
    flows = flows.filter(f => f.t < 0.36);
    for(const p of pops) p.t += dt;
    pops = pops.filter(p => p.t < 1.6);
    if(glowT > 0) glowT = Math.max(0, glowT - dt * 0.8);
    if(hintT > 0){ hintT -= dt; if(hintT <= 0){ hintOn = false; hintMove = null; } }
    if(demo){
      demo.t += dt;
      if(!demoPaused && demo.t >= 0.42 && demo.idx < demo.path.length){
        const mv = demo.path[demo.idx];
        doPour(mv[0], mv[1], true); sndPour(0);
        demo.idx++; demo.t = 0;
        if(demo.idx >= demo.path.length) setTimeout(() => { if(demo) { stopDemo(); finish(); } }, 380);
      }
    }
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- 提示 / 演示 ---------- */
  function applyPathMove(mv){ return doPour(mv[0], mv[1], true); }
  function showHint(){
    if(demo) return;
    // 提示 = 直接给当前局面下"已知最优解法"的下一步（关卡数据自带解法）
    const sol = curLevel().sol || [];
    // 从初始盘面重放，找到与当前盘面相符的最长前缀
    let t = start.map(x => x.slice()), idx = 0, h = -1;
    const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    if(same(t, tubes)) h = 0;
    else {
      for(let i = 0; i < sol.length; i++){
        const nt = t.map(x => x.slice());
        const k = Math.min((function run(arr){ if(!arr.length) return 0;
          const c = arr[arr.length - 1]; let n = 1;
          while(n < arr.length && arr[arr.length - 1 - n] === c) n++; return n; })(t[sol[i][0]]),
          CAP - t[sol[i][1]].length);
        for(let q = 0; q < k; q++) nt[sol[i][1]].push(nt[sol[i][0]].pop());
        t = nt;
        if(same(t, tubes)){ idx = i + 1; h = idx; break; }
      }
      if(h < 0){ h = 0; }   // 玩家走偏了 → 从解法开头提示
    }
    const mv = sol[idx] || sol[sol.length - 1];
    hintMove = mv ? { from: mv[0], to: mv[1] } : null;
    hintOn = true; hintT = 3.0;
    if(mv){ toast('提示：把第 ' + (mv[0] + 1) + ' 管倒入第 ' + (mv[1] + 1) + ' 管'); }
    else toast('这一局已经没有可提示的走法');
  }
  function startDemo(){
    if(demo) return;
    stopDemo();
    loadLevel(setId, lvIdx, true);
    demo = { path: (curLevel().sol || []).slice(), idx: 0, t: 0 };
    demoPaused = false;
    sel = -1;
    $('menu').classList.remove('on');
    $('over').classList.remove('on');
  }
  function stopDemo(){
    demo = null; demoPaused = false;
    tubes = start.map(t => t.slice());
    steps = 0; history = []; sel = -1;
    state = 'play'; flows = [];
    $('over').classList.remove('on');
  }
  function toggleDemoPause(){ if(demo) demoPaused = !demoPaused; }

  /* ---------- UI ---------- */
  function toast(msg){
    const el = $('toast'); el.textContent = msg; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1600);
  }
  function syncUndoBtn(){
    const b = $('btnUndo'); if(!b) return;
    const can = !demo && history.length > 0;
    b.className = can ? 'undo-ready' : 'off';
    b.textContent = can ? '↶ 撤销 ' + history.length : '↶ 撤销';
  }
  function syncHud(){
    const lv = curLevel();
    $('hud').innerHTML = curSet().name + ' · 第 <b>' + lv.id + '</b> 关 · 步数 <b>' + steps + '</b>' +
      (getNum(bestKey(setId, lvIdx)) ? ' · 最佳 <b>' + getNum(bestKey(setId, lvIdx)) + '</b>' : '');
  }
  function renderLv(){
    const tabs = $('tabs'); tabs.innerHTML = '';
    LEVEL_SETS.forEach((s, i) => {
      const b = document.createElement('button');
      const done = s.levels.filter((_, j) => getNum(clearKey(i, j))).length;
      b.textContent = s.name + ' ' + done + '/' + s.levels.length;
      if(i === setId) b.className = 'on';
      b.onclick = () => { sndClick(); setId = i; lvIdx = 0; renderLv(); loadLevel(setId, lvIdx); };
      tabs.appendChild(b);
    });
    const grid = $('lvgrid'); grid.innerHTML = '';
    curSet().levels.forEach((lv, j) => {
      const b = document.createElement('button');
      b.innerHTML = '<b>' + lv.id + '</b><br><i style="font-style:normal;font-size:10px;opacity:.75">' +
        '★'.repeat(lv.stars) + ' ' + lv.min + '步</i>';
      if(j === lvIdx) b.className = 'on';
      if(getNum(clearKey(setId, j))) b.classList.add('done');
      b.onclick = () => { sndClick(); lvIdx = j; $('lv').classList.remove('on'); loadLevel(setId, lvIdx); };
      grid.appendChild(b);
    });
  }

  /* ---------- 关卡装载 ---------- */
  function loadLevel(si, li, silent){
    setId = Math.max(0, Math.min(si, LEVEL_SETS.length - 1));
    lvIdx = Math.max(0, Math.min(li, curSet().levels.length - 1));
    const lv = curLevel();
    tubes = (lv.tubes || [[], []]).map(t => t.slice());
    start = tubes.map(t => t.slice());
    steps = 0; history = []; sel = -1; demo = null; demoPaused = false;
    flows = []; pops = []; hintOn = false; hintMove = null; state = 'play';
    best = getNum(bestKey(setId, lvIdx));
    $('over').classList.remove('on');
    fit(); syncUndoBtn(); syncHud();
    if(!silent){ setNum('watersort_last', setId + ':' + lvIdx); }
  }
  function saveLast(){ try{ const v = localStorage.getItem('watersort_last'); if(!v) return; const p = v.split(':'); setId = +p[0] || 0; lvIdx = +p[1] || 0; }catch(e){} }

  /* ---------- 绑定 ---------- */
  function init(){
    Wc = W; Hc = HFIX;
    saveLast();
    if(lvIdx >= curSet().levels.length) lvIdx = 0;
    loadLevel(setId, lvIdx, true);
    bindPointer();
    $('btnUndo').onclick = () => { audio(); sndClick(); undo(); };
    $('btnMenu').onclick = () => { sndClick(); $('menu').classList.toggle('on'); };
    $('mClose').onclick = () => { sndClick(); $('menu').classList.remove('on'); };
    $('mReset').onclick = () => { sndClick(); $('menu').classList.remove('on'); loadLevel(setId, lvIdx); toast('已重置本关'); };
    $('mHint').onclick = () => { sndClick(); $('menu').classList.remove('on'); showHint(); };
    $('mDemo').onclick = () => { sndClick(); startDemo(); };
    $('mLv').onclick = () => { sndClick(); $('menu').classList.remove('on'); renderLv(); $('lv').classList.add('on'); };
    $('mSound').onclick = () => { soundOn = !soundOn; audio(); sndClick(); toast(soundOn ? '音效已开' : '音效已关'); $('mSound').textContent = soundOn ? '🔊 音效' : '🔇 静音'; };
    $('mDiag').onclick = () => { sndClick(); dbgOn = !dbgOn; $('mDiag').textContent = dbgOn ? '诊断 ✓' : '诊断'; };
    $('lvClose').onclick = () => { sndClick(); $('lv').classList.remove('on'); };
    $('overRetry').onclick = () => { sndClick(); loadLevel(setId, lvIdx); };
    $('overNext').onclick = () => { sndClick(); nextLevel(); };
    if(/[?&]debug/.test(location.search)) dbgOn = true;
    layout();
    requestAnimationFrame(frame);
  }

  /* ---------- 测试钩子 ---------- */
  window.__ws = () => ({
    setId, lvIdx, steps, state, cap: CAP, n: tubes.length,
    tubes: tubes.map(t => t.slice()), start: start.map(t => t.slice()),
    hist: history.length, best, sel, demo: !!demo, demoIdx: demo ? demo.idx : -1,
    geo: { tw: geo.tw, th: geo.th, rows: geo.rows, cols: geo.cols },
    W: Wc, H: Hc, S, OFFX, OFFY, dpr: dprNow,
    min: curLevel().min, stars: curLevel().stars,
    toLogical: (x, y) => toLogical(x, y),
  });
  window.__wsSetStage = (w, h) => { stage.clientWidth = w; stage.clientHeight = h; layout(); return true; };
  window.__wsGoto = (s, l) => { loadLevel(s, l); return true; };
  window.__wsPour = (from, to) => doPour(from, to, true);
  window.__wsCan = (from, to) => canPour(from, to);
  window.__wsUndo = () => undo();
  window.__wsReset = () => { loadLevel(setId, lvIdx); return true; };
  window.__wsHint = () => showHint();
  window.__wsHintMove = () => hintMove;
  window.__wsDemo = () => { startDemo(); return !!demo; };
  window.__wsDemoPause = () => { toggleDemoPause(); return demoPaused; };
  window.__wsExitDemo = () => { const had = !!demo; stopDemo(); return had; };
  window.__wsStep = dt => { /* 推进演示 */ if(demo && !demoPaused){ const mv = demo.path[demo.idx];
      if(mv){ doPour(mv[0], mv[1], true); demo.idx++; if(demo.idx >= demo.path.length){ stopDemo(); finish(); } } } return demo ? demo.idx : -1; };
  window.__wsFinish = () => { finish(); return state; };
  window.__wsPanel = () => { showPanel(); return $('over').classList.contains('on'); };
  window.__wsPanelInfo = () => ({
    open: $('over').classList.contains('on'), title: $('overTitle').textContent,
    sub: $('overSub').textContent, text: $('overText').textContent,
    nextLabel: $('overNext').textContent, nextVisible: $('overNext').style.display !== 'none',
    setDone: lvIdx + 1 >= curSet().levels.length,
    hasNextSet: setId + 1 < LEVEL_SETS.length,
  });
  window.__wsNext = () => { $('overNext').onclick(); return { setId, lvIdx }; };
  window.__wsTiers = () => LEVEL_SETS.map(s => ({ id: s.id, name: s.name, stars: s.stars, count: s.levels.length,
    mins: s.levels.map(l => l.min) }));
  window.__wsSolveCheck = (s, l) => {
    // 用自带解法逐关校验：回放后必须通关，且步数 == 声称最少步数
    const sv = LEVEL_SETS[s].levels[l];
    let t = sv.tubes.map(x => x.slice());
    const CAPX = CAP;
    const run = arr => { if(!arr.length) return 0; const c = arr[arr.length - 1]; let n = 1;
      while(n < arr.length && arr[arr.length - 1 - n] === c) n++; return n; };
    for(const mv of sv.sol){
      const a = t[mv[0]], b = t[mv[1]];
      if(!a.length || b.length >= CAPX) return { ok:false, why:'非法步骤(空/满)' };
      if(b.length && b[b.length-1] !== a[a.length-1]) return { ok:false, why:'颜色不符' };
      const k = Math.min(run(a), CAPX - b.length);
      for(let q = 0; q < k; q++) b.push(a.pop());
    }
    const done = t.every(x => x.length === 0 || (x.length === CAPX && x.every(c => c === x[0])));
    return { ok: done && sv.sol.length === sv.min, steps: sv.sol.length, min: sv.min, done };
  };
  init();
})();
</script>
</body>

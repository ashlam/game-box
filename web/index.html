<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小游戏盒子</title>
<style>
  :root{
    --bg:#0f1115; --card:#191d26; --card2:#202632; --line:#2b3242;
    --txt:#e8ecf3; --dim:#8b95a7; --acc:#5b8cff; --acc2:#38d39f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1b2233 0%,var(--bg) 60%);
    color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    padding:calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 26px);
    display:flex;flex-direction:column;align-items:center;min-height:100%;
  }
  header{text-align:center;margin-bottom:26px}
  h1{font-size:26px;margin:0 0 8px;letter-spacing:1px}
  .sub{color:var(--dim);font-size:13px}
  .grid{width:100%;max-width:460px;display:grid;gap:14px}
  a.card{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--txt);
    background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:18px;padding:18px 16px;
    transition:transform .12s ease,border-color .12s ease;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  a.card:active{transform:scale(.975);border-color:var(--acc)}
  .icon{
    width:56px;height:56px;flex:0 0 56px;border-radius:14px;display:grid;place-items:center;
    font-size:28px;background:#0d1017;border:1px solid var(--line)
  }
  .meta{flex:1;min-width:0}
  .name{font-size:18px;font-weight:600;margin-bottom:4px}
  .desc{font-size:12.5px;color:var(--dim);line-height:1.45}
  .tag{font-size:11px;color:var(--acc2);border:1px solid rgba(56,211,159,.35);
       background:rgba(56,211,159,.08);padding:2px 8px;border-radius:99px;white-space:nowrap}
  .soon{
    display:flex;align-items:center;gap:16px;background:var(--card);border:1px dashed var(--line);
    border-radius:18px;padding:18px 16px;opacity:.55
  }
  footer{margin-top:auto;padding-top:26px;color:var(--dim);font-size:12px;text-align:center;line-height:1.7}
  code{background:#0d1017;border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-size:11.5px}
</style>
</head>
<body>
<header>
  <h1>🎲 小游戏盒子</h1>
  <div class="sub">手机浏览器直接玩 · 无需安装</div>
</header>

<div class="grid">
  <a class="card" href="/othello/">
    <div class="icon">⚫</div>
    <div class="meta">
      <div class="name">黑白棋 <span class="tag">对 AI</span></div>
      <div class="desc">经典翻转棋 · 三档难度 · 支持悔棋和落子提示</div>
    </div>
  </a>

  <a class="card" href="/sokoban/">
    <div class="icon">📦</div>
    <div class="meta">
      <div class="name">仓库番 <span class="tag">24 关 · 经典集</span></div>
      <div class="desc">推箱子 · 经典关卡集（难度 14→91 推递增，已去掉开局消遣关）· 触屏方向键 + 滑动 · 可撤销 · 记录最好成绩</div>
    </div>
  </a>

  <a class="card" href="/breakout/">
    <div class="icon">🧱</div>
    <div class="meta">
      <div class="name">打砖块 <span class="tag">8 关 · 触屏挡板</span></div>
      <div class="desc">经典打砖块 · 拖动屏幕控制挡板 · 搓球变向 · 砖块有硬度 · 记录最高分</div>
    </div>
  </a>

  <div class="soon">
    <div class="icon">➕</div>
    <div class="meta">
      <div class="name">更多游戏</div>
      <div class="desc">想做哪个直接说，随时加进来</div>
    </div>
  </div>
</div>

<footer>
  地址：<code id="addr"></code><br>
  <span id="hint">建议「添加到主屏幕」，像 App 一样全屏玩</span>
</footer>

<script>
  document.getElementById('addr').textContent = location.host;
</script>
</body>
</html>
